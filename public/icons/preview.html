<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>List + Search — Lottie preview</title>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: #f4f6fb; color: #1b2230;
      font: 15px/1.5 -apple-system, system-ui, Segoe UI, Roboto, sans-serif;
    }
    .wrap { display: flex; gap: 40px; flex-wrap: wrap; justify-content: center; padding: 40px; }
    figure { margin: 0; text-align: center; }
    .box {
      width: 260px; height: 260px; border-radius: 28px; background: #fff;
      box-shadow: 0 10px 40px rgba(20, 30, 60, .12); display: grid; place-items: center;
    }
    .box img, .box #lottie { width: 220px; height: 220px; }
    figcaption { margin-top: 14px; font-weight: 600; }
    figcaption small { display: block; font-weight: 400; color: #6b7488; }
  </style>
</head>
<body>
  <div class="wrap">
    <figure>
      <div class="box"><div id="lottie"></div></div>
      <figcaption>Lottie (lottie-web)<small>list-search.json — vector, looped</small></figcaption>
    </figure>
    <figure>
      <div class="box"><img src="./list-search.gif" alt="List + Search animation" /></div>
      <figcaption>GIF preview<small>list-search.gif — 50 fps, 3 s</small></figcaption>
    </figure>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/bodymovin/5.12.2/lottie.min.js"></script>
  <script>
    if (window.lottie) {
      lottie.loadAnimation({
        container: document.getElementById('lottie'),
        renderer: 'svg', loop: true, autoplay: true,
        path: './list-search.json',
      });
    } else {
      // offline / CDN blocked — fall back to the GIF
      document.getElementById('lottie').innerHTML =
        '<img src="./list-search.gif" style="width:100%;height:100%" alt="" />';
    }
  </script>
</body>
</html>
